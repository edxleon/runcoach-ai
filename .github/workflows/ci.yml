name: ci

on:
  push:
    branches: [main]
  pull_request:

# One matrix per branch. Pushing twice in a minute otherwise leaves the first
# six legs running against a commit nobody is waiting for any more. A push to
# `main` is not cancelled: its result is the badge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing in this workflow writes to the repo, packages or
# releases. Job-level grants stay opt-in from here.
permissions:
  contents: read

jobs:
  test:
    # The slowest leg (Windows) measures three to four minutes, so fifteen is
    # around four times the headroom and still catches a hang early. Without it
    # the default is six HOURS per leg — and this suite has already had one:
    # headless Chrome on the macOS runners never returns, it only ever hit a
    # timeout inside the test.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # `requires-python = ">=3.12"` is a promise about every version above it;
        # one unpinned interpreter per OS tested none of them in particular.
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, and these
      # three run with access to the workflow token before any test does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          # Keyed on uv.lock, so the cache is only reused for the exact
          # dependency set it was built from.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The matrix is only real if the interpreter actually changes with it.
      # `.python-version` pins the local dev interpreter and could quietly win
      # over the matrix, which would leave one leg testing the other's version
      # and the README claiming two. So every `uv run` names the version, and
      # this step fails the job if what arrives is not what was asked for.
      - name: The interpreter is the one this leg is for
        run: |
          uv run --python ${{ matrix.python }} python -c "import sys; got = '%d.%d' % sys.version_info[:2]; want = '${{ matrix.python }}'; print('running', got); raise SystemExit(0 if got == want else f'expected {want}, got {got}')"

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check
      - name: Python tests (no database server, no network, no Garmin account)
        run: uv run --python ${{ matrix.python }} pytest -q
      - name: Frontend logic tests
        run: node --test "web-tests/*.test.mjs"
      - name: Eval suite is well-formed (dry run, no model calls)
        run: uv run --python ${{ matrix.python }} python evals/run_evals.py --dry-run
      - name: Nothing personal in the tree
        run: uv run --python ${{ matrix.python }} python scripts/pii_gate.py

  # The suite above proves the code from inside the checkout. This job proves
  # the PACKAGE from outside it: build the wheel, `uv tool install` it into a
  # throw-away tool dir the way a user would, and drive the installed
  # executable through the README's quick start - demo over HTTP, doctor,
  # sync, login without a terminal, the MCP handshake. It is the "other
  # computer" the author does not have: a machine that has never seen the
  # source tree. Standard-library Python drives it, so it runs on whatever
  # interpreter the runner has, and the installed tool brings its own.
  install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the wheel as a user and use it as one
        run: uv run --no-project python scripts/install_check.py
