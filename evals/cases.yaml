  - id: a-week-fitted-to-a-full-calendar-says-what-it-kept
    description: "propose_week on a week that already holds threshold, VO2max and the long run -> one easy run added; the kept sessions named, nothing doubled, a yes asked for the one new session"
    today: 2026-09-18
