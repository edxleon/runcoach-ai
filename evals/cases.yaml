  # 23. The way back, which the video advertises. "Take it back off" is a
  #     write too: it needs the call, and the result is reported only after it.
  - id: take-it-back-off-is-a-call-not-a-claim
    description: "After an apply, the athlete says 'take it back off'; the tools cannot be called -> the coach names undo for that proposal and never claims it is removed"
    today: 2026-06-09
    input: |
      Earlier in this conversation:

      === apply_workout(proposal_id="p-20260609-081500-4c1d") ===
      On Garmin: "Easy run 40 min" (workout 900002) scheduled for 2026-06-10, pushed to the watch.
