        interval  67:00 min  HR 125-143 bpm
        assumption: 4 running days - no days_per_week in the profile (runcoach profile --days-per-week N)
        assumption: long run on sun - no long_run_day in the profile (runcoach profile --long-run-day sun)
        assumption: week sized at ~172 min from your last 4 running weeks (150, 153, 159, 165 min, median 156) plus 10 % - the 10 % step is a convention, not a finding, and a down week or taper among those weeks pulls it down with them
        assumption: measurement week: no new VO2max value for 39 days; >= 12 min of even effort at threshold is what Garmin measures from; the steady block takes the threshold slot, the VO2max session stays
        assumption: sessions scaled to 75 % of the built-in week (~172 min across 4 days)
      4 sessions, 2026-10-20 onwards - proposal p-20261019-071500-a1b2
      NOT on Garmin yet. Show this to the athlete; if they say yes, call apply_workout(proposal_id="p-20261019-071500-a1b2"). If they want changes, propose again.
    expect:
