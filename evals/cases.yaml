        threshold on Thursday, and its assumption line says it is a measurement
        week: Garmin has recorded no new VO2max value for 39 days, and at least
        12 minutes of even effort at threshold is the one shape Garmin
        re-measures VO2max from. The app's own decision for today also names
        the steady block as the hard session for the same reason. The coach's
        rules say the measurement is not a hard session to trade away, and
        that intervals move to after the reading rather than replacing it.
        Does the answer meet ALL of these: (1) it keeps the steady block in the
        week and explains it as the measurement - that Garmin has had nothing
        to measure from for 39 days and this block is what gives it a reading;
        (2) it does NOT replace the steady block with 5x4 or any second
        interval session this week, and does not file or offer a new proposal
        that does so (offering intervals AFTER the measurement, e.g. next week,
