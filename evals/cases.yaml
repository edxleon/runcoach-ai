        calendar: 2026-09-27: the calendar already has "Long run" - kept, nothing added that day
        assumption: week sized at ~241 min from your last 4 weeks (191, 206, 233, 234 min, median 219) plus 10 % - the 10 % step is a convention, not a finding, and a down week or taper among those weeks pulls it down with them
