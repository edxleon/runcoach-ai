  # 27. What comes next, the down week. Three weeks up, and the planner sized
  #     the fourth at 70 % and said so. "Why so little, am I losing fitness?" is
  #     the question that gets answered with "detraining" by a coach who reads
  #     a small week as a problem - it is the progression working.
  - id: down-week-is-the-plan-not-detraining
