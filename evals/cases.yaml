      === get_training_readiness ===
      [GO] Readiness 2026-10-19: GO
      Reasons: Recovery in the green

      Signals: HRV BALANCED / sleep score 84 / Body Battery 82 / resting HR 46 bpm (baseline 47.0) / ACWR 1.08 (garmin) / status MAINTAINING / last hard workout 1 day(s) ago

      The app's decision for today: EASY - "Easy today - the last hard session was yesterday; hard stimuli are 48 hours apart." (rule: 48-hour rule; this week 0 of 38 min above the easy zones, of which 0 above threshold). This is the decision the athlete sees. Explain it, or disagree with it using numbers - do not silently replace it with your own.

      Garmin calendar: nothing scheduled in the next 7 days.

      === propose_week(start_day=2026-10-19) ===
      Tue 2026-10-20: VO2max 3x3 min  (vo2max; ~5.3 km, ~30 min)
        warmup     8:00 min  no target
        3x
          interval   3:00 min  HR zone 5
          recovery   2:30 min  no target
        cooldown   5:30 min  no target

      Wed 2026-10-21: Easy run 27 min  (easy; ~4.3 km, ~27 min)
        interval  27:00 min  HR 125-143 bpm

      Thu 2026-10-22: Threshold 2x8 min  (threshold; ~6.0 km, ~33 min)
        warmup     8:00 min  no target
        2x
          interval   8:00 min  HR zone 4
          recovery   2:00 min  no target
        cooldown   5:00 min  no target

      Sun 2026-10-25: Long run 54 min  (long; ~8.6 km, ~54 min)
        interval  54:00 min  HR 125-143 bpm
        assumption: 4 running days - no days_per_week in the profile (runcoach profile --days-per-week N)
        assumption: long run on sun - no long_run_day in the profile (runcoach profile --long-run-day sun)
        assumption: week sized at ~144 min from your last 4 running weeks (150, 198, 213, 243 min, median 205): down week: 3 weeks up (198, 213, 243 min), so this one is sized at 70 % and the adaptation can land (zones.md: every 3-4 weeks)
        assumption: sessions scaled to 60 % of the built-in week (~144 min across 4 days)
      4 sessions, 2026-10-20 onwards - proposal p-20261019-071600-c3d4
      NOT on Garmin yet. Show this to the athlete; if they say yes, call apply_workout(proposal_id="p-20261019-071600-c3d4"). If they want changes, propose again.
    expect:
      must_contain: ["p-20261019-071600-c3d4"]
      judge_question: >
        Context: a runner whose last four running weeks were 150, 198, 213 and
        243 minutes asked for next week. The planning tool filed a week of
        about 144 minutes (proposal p-20261019-071600-c3d4, not yet on the
        watch), and its assumption line says: down week - three weeks up (198,
