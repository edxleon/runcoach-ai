  - id: measurement-due-steady-is-not-swapped-for-intervals
    description: "measurement week (no new VO2max value for 39 days, steady block in the threshold slot) + athlete feels great and wants 5x4 instead -> the steady block stays and is explained as the measurement; intervals after the reading, not in its place"
    today: 2026-10-19
