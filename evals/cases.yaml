      - Moderate (Z3):   1h 05m (12.5%)
      - Hard (Z4-5):     1h 26m (16.5%)
          of which Z5:   0m (0.0%)

      === get_recent_activities ===
      Workouts 2026-05-21 .. 2026-06-17

      Latest:
      - 2026-06-16 running (Tempo): 10.1 km/50m / load 151 TE 3.5/0.8 / 162 bpm
      - 2026-06-09 running (Tempo): 10.0 km/50m / load 149 TE 3.4/0.7 / 161 bpm
      - 2026-06-02 running (Tempo): 9.8 km/49m / load 146 TE 3.4/0.6 / 161 bpm
      - 2026-05-26 running (Tempo): 10.2 km/51m / load 150 TE 3.5/0.8 / 162 bpm
    expect:
      judge_question: >
        Context: a runner asks why VO2max is not moving and says they do a hard
        tempo run every week. The data: VO2max 49.0 with no change in 56 days;
        in the last 28 days 16.5 % of training time was hard (zone 4-5)
        but ZERO minutes were in zone 5; the hard sessions were four tempo runs
        (zone 4, aerobic training effect ~3.5, anaerobic ~0.7). The coach's
        rule: a tempo/threshold run counts as hard for spacing, but it does not
        refute "too little VO2max stimulus" - only work near VO2max (zone 5
        intervals) does; and things in the data "fit mechanically", they are
        not proven causes. Does the answer meet ALL of these: (1) it does NOT
        treat the tempo runs as the VO2max stimulus already being covered;
        (2) it names the missing zone-5 / VO2max-interval work as what the data
        shows is absent; (3) it does not claim as PROVEN that the missing
        zone-5 work is the reason the VO2max value has not changed (saying it
        fits, is consistent with or is the likely gap is fine)? Classifying
        tempo runs as threshold work rather than VO2max work is what (1) asks
