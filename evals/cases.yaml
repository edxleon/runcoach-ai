  # 24. Days that never synced are unknown, not empty. A low ACWR and a
  #     DETRAINING status from five days ago read as "you have stopped
  #     training" is the false finding the rule exists for.
  - id: unsynced-days-are-not-detraining
    description: "Last data five days old, sync fails, ACWR 0.62 and DETRAINING as of then -> no 'detraining'/'missed sessions' claim about the unsynced days, quoted with its date, the athlete asked"
    today: 2026-06-17
    input: |
      Athlete: How is my training load looking?

      === get_training_readiness ===
      [EASY] Readiness 2026-06-12: EASY
      Reasons: ACWR 0.62 (detraining range - stimulus missing)

      Signals: HRV BALANCED / sleep score 74 / Body Battery 70 / resting HR 49 bpm (baseline 49.2) / ACWR 0.62 (garmin) / status DETRAINING / last hard workout 6 day(s) ago
      NOTE: latest data is from 2026-06-12, not today - treat the verdict as stale.

      === sync_garmin(days=7) ===
      Garmin login failed (GarminConnectAuthenticationError) - the stored session has probably expired. Ask the user to run `runcoach login`.

      === get_training_load ===
      Training load 2026-05-16 .. 2026-06-12

      - Status: DETRAINING
      - ACWR (acute:chronic): 0.62 [garmin] / LOW - acute 7d 260, chronic ~420/week, 2 workouts/7d
    expect:
      must_contain: ["runcoach login"]
      judge_question: >
        Context: a runner asks how their training load looks. The latest synced
        data is from 2026-06-12, five days ago, and the attempt to sync failed
        because the Garmin login expired (fix: run `runcoach login`). As of
        2026-06-12 the ACWR was 0.62 and Garmin's status DETRAINING. The days
        since then are UNKNOWN - not empty: runs on them are simply not in the
        data. The coach's rule: quote ACWR and status as of their date, never
        read a gap, "detraining" or "missed sessions" from unsynced days, and
        ask the athlete what they ran. Does the answer meet ALL of these: (1)
        it says the data is from 2026-06-12 / five days old and the sync
        failed; (2) it does NOT tell the runner they are detraining now or
        have missed or skipped training in the last days as a fact; (3) it
        asks what they ran since then, or makes the assessment conditional on
        it? PASS only if all three hold.

  # 25. The stimulus must match the claim: weekly tempo runs are hard for
  #     spacing, and they still leave "too little VO2max stimulus" standing.
  - id: tempo-runs-do-not-set-a-vo2max-stimulus
    description: "VO2max flat, weekly tempo runs (Z4) and zero Z5 minutes in 28 days -> tempo not counted as the VO2max stimulus; the missing Z5 work named, no causal claim"
    today: 2026-06-17
    input: |
      Athlete: Why isn't my VO2max moving? I do a hard tempo run every week.

      === get_vo2max_history ===
      VO2max 49.0 (as of 2026-06-17); change 28d 0.0, 56d 0.0. Garmin carries the value forward - only the days below are real changes:
      - 2026-04-20: 49.0

      Last 28 days vs the 28 before (descriptive, not causal):
      - last 28d: 12 runs, 118.4 km, Z5 0.0 min, easy 71.0%, avg temp 17.2 C (12 with zone detail)
      - prev 28d: 12 runs, 116.9 km, Z5 0.0 min, easy 70.4%, avg temp 13.9 C (12 with zone detail)

