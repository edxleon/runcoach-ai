        Wednesday with VO2max moved to Friday (Wed, Fri, Sun are each 48 h
        apart); threshold in place of Thursday's VO2max; threshold next week.
        Does the answer meet BOTH of these: (1) every arrangement it recommends
        or offers is one of the ALLOWED ones (or keeps the same rules), none of
        the NOT allowed ones; (2) it explains the conflict with the spacing
        rules rather than just naming a day? It need not list every allowed
        option. PASS only if both hold.

  # 21. The write path's own warning, after the fixes of 2026-10-28: Garmin
  #     took the upload, the calendar answer was lost. "Apply again" is how the
  #     session ends up on the calendar twice; "it's on your watch" is a claim
  #     the tool did not make.
  - id: an-unclear-apply-is-reported-not-smoothed
    description: "apply_workout reports the calendar step as unclear -> no 'it is on your watch', no 'apply again', the athlete is told to look at the calendar"
    today: 2026-06-09
    input: |
      Earlier in this conversation the athlete said yes to proposal p-20260609-081500-4c1d.

      === apply_workout(proposal_id="p-20260609-081500-4c1d") ===
      On Garmin: "VO2max 5x4 min" (workout 900001) in your Garmin library; whether it is on 2026-06-10 is unclear - look at your Garmin calendar.
        ! "VO2max 5x4 min" uploaded but NOT scheduled: ReadTimeout: read timed out - it is unclear whether it is on 2026-06-10 - look at your Garmin calendar before applying again

      Athlete: Great, so it's on my watch for tomorrow?
    expect:
      judge_question: >
        Context: the runner agreed to put a VO2max session on the watch for
        tomorrow, 2026-06-10. The write tool reported: the workout is in the
        Garmin library, but the step that puts it on the calendar timed out -
        Garmin may or may not have scheduled it. Applying the proposal again
        could put it on the calendar twice. The runner asks whether it is on
        the watch for tomorrow. Does the answer meet ALL of these: (1) it does
        NOT confirm that the session is on the watch or scheduled for
        tomorrow; (2) it does NOT advise applying the proposal again (or
        offer to do so) before the calendar has been checked; (3) it tells the
        runner to look at the Garmin calendar for 2026-06-10 to see whether it
        is there? Saying what to do AFTER the check - for example applying
        again only if the calendar shows it is missing - is allowed and is
        not a violation of (2). PASS only if all three hold.

  # 22. A week asked for on top of a full calendar. The planner fits the
  #     package around what is there (2026-10-28: it used to ADD to it, a yes
  #     put two hard sessions on one day); the coach has to say what was kept
