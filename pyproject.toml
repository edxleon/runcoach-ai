[project]
name = "runspector"
version = "0.6.0"
description = "AI running coach for Garmin: reads HRV, sleep and training load, explains readiness and VO2max, puts workouts on your watch. Local, free, an MCP server for Claude."
# PyPI renders this page without the repository around it, so it is its own,
# shorter file with absolute links - and the one the MCP registry reads the
# `mcp-name` line from (tests/test_packaging.py).
readme = "docs/pypi.md"
authors = [{ name = "Eddie Leon", email = "23697411+edxleon@users.noreply.github.com" }]
requires-python = ">=3.12"
license = "MIT"
keywords = ["running", "coach", "running-coach", "garmin", "garmin-connect", "vo2max", "hrv", "training",
            "ai", "mcp", "mcp-server", "claude", "claude-code", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # Unofficial, reverse-engineered Garmin client that handles the account
    # session: it tracks an API nobody promised to keep stable, so a minor bump
    # can rename endpoints or change the login flow. Capped on purpose — raise
    # the bound deliberately, after `tests/test_api_contract.py` still passes.
    "garminconnect>=0.2.25,<0.4",
    "mcp>=1.27,<2",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://edxleon.github.io/runspector/"
Repository = "https://github.com/edxleon/runspector"
Issues = "https://github.com/edxleon/runspector/issues"
Changelog = "https://github.com/edxleon/runspector/releases"

[project.scripts]
runspector = "runspector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "pyyaml>=6",
    "ruff>=0.14",
]
mutation = [
    "mutmut==3.8.0",
]

[build-system]
requires = ["hatchling==1.32.4"]   # exact: it runs in the release build
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The `# noqa:` markers in the source refer to these rules — without the section
# they documented a config that did not exist. Every suppressed code is selected
# here, so each marker is load-bearing and `ruff check` is a real gate.
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except  (a catch-all that swallows carries `# noqa: BLE001` + reason)
    "N",    # pep8-naming          (ruff knows do_GET/do_POST override the stdlib)
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade            (the syntax of the oldest Python we support, 3.12)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return        (a function that returns a value says so on every path)
    "S603", # subprocess call      (every spawn in shipped code carries a `noqa` that says
    "S607", # partial exe path      why its argv holds no outside text)
    "RUF100", # a `noqa` that suppresses nothing - keeps every marker load-bearing
]
# A nested `if` that carries a comment of its own, and a `try/except: pass` that
# says why the error is harmless, read better than their one-line forms.
ignore = ["SIM102", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# HTML and GSAP templates that build the video composition: one element per
# line reads better than a string broken at 110 columns.
"docs/video/build.py" = ["E501", "S603", "S607"]
# Tests, evals and maintainer scripts spawn our own tools with fixed arguments;
# the subprocess rules are about code that ships.
"tests/**" = ["S603", "S607"]
"evals/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]

# Mutation testing (.github/workflows/mutation.yml, Linux only: mutmut needs a
# clean fork()). The rule modules the coach's decisions come from - the files
# CLAUDE.md asks a scenario test for. A surviving mutant is a change to a rule
# that no test notices.
[tool.mutmut]
paths_to_mutate = [
    "src/runspector/logic.py",
    "src/runspector/planning.py",
    "src/runspector/plan.py",
    "src/runspector/habits.py",
]
# mutmut copies only the mutated files into mutants/; the tests import the rest
# of the package and read the README, the evals and the frontend tests too.
also_copy = ["src/runspector", "evals", "web-tests", "scripts", "docs", "README.md", "CLAUDE.md"]
# The tests that pin rules, plus test_tools.py (apply and undo are only tested
# there). Not the web, UI and simulation tests: they reach nearly every rule
# function, and with them a mutant waits ~31 s for its tests instead of ~12 -
# about ten hours of runner time a week. The simulation's seeds are sweep.yml's.
pytest_add_cli_args_test_selection = [
    "tests/test_logic.py",
    "tests/test_planning.py",
    "tests/test_habits.py",
    "tests/test_what_comes_next.py",
    "tests/test_build_week_golden.py",
    "tests/test_profile.py",
    "tests/test_facts.py",
    "tests/test_tools.py",
]
